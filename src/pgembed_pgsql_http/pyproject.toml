[project]
name = "pgembed-http"
version = "0.1.8"
description = "pgsql-http extension for pgembed"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pgembed>=0.1.8"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pgembed_pgsql_http"]

# The prebuilt extension binaries are staged next to __init__.py by CI
# (see .github/workflows/publish-pgembed-http.yml) before building.
[tool.setuptools.package-data]
pgembed_pgsql_http = ["http.so", "http.control", "http--*.sql"]

[build-system]
requires = ["setuptools>=58.0.0", "wheel"]
build-backend = "setuptools.build_meta"
